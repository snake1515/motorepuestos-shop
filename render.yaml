services:
  - type: web
    name: motorepuestos-shop
    runtime: static
    buildCommand: "echo 'sitio estático, sin build'"
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /fotos/*
        name: Cache-Control
        value: public, max-age=2592000
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
