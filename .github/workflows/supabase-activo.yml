# Mantiene activo el proyecto de Supabase (el plan gratuito lo pausa tras ~7 días
# sin actividad). Cada 3 días consulta la configuración pública de la tienda,
# con la misma clave pública que ya usa la página (public/config.js).
name: Mantener Supabase activo

on:
  schedule:
    - cron: '17 14 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Consultar Supabase
        run: |
          URL=$(grep -oE "url:[[:space:]]*'[^']+'" public/config.js | sed -E "s/url:[[:space:]]*'([^']+)'/\1/")
          KEY=$(grep -oE "anonKey:[[:space:]]*'[^']+'" public/config.js | sed -E "s/anonKey:[[:space:]]*'([^']+)'/\1/")
          code=$(curl -s -o /dev/null -w '%{http_code}' "$URL/rest/v1/products?select=id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Respuesta de Supabase: $code"
          test "$code" = "200"
